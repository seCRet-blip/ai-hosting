events {
    worker_connections 1024;
}

http {
    upstream ai_backend {
        server ai-model-api:5001;
    }

    # Rate limiting zones - strict limits to prevent abuse
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/m;  # ~30 requests per hour (1 per 2 mins)
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/m;  # 10 predictions per minute
    
    # Connection limits
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # CORS allowed origins - update ALLOWED_ORIGIN when you have your domain
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
        # Add your domain when ready: "https://yourdomain.com" $http_origin;
    }

    server {
        listen 80;
        
        # Security headers (moved here to prevent duplication with CORS headers)
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # API endpoints
        location / {
            # Apply rate limiting and connection limits
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-API-Key, ngrok-skip-browser-warning';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Add CORS headers to proxied responses
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-API-Key, ngrok-skip-browser-warning';
            add_header 'Access-Control-Allow-Credentials' 'true';
            
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeout for image processing
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            
            # Increase max body size for image uploads
            client_max_body_size 10M;
            
            # Buffer settings to prevent memory exhaustion
            client_body_buffer_size 128k;
        }
        
        # Prediction endpoint with stricter limits
        location /predict {
            # Stricter rate limiting for predictions
            limit_req zone=predict_limit burst=5 nodelay;
            limit_conn conn_limit 5;

            # Handle preflight requests - return immediately without proxy
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-API-Key, ngrok-skip-browser-warning' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }
            
            proxy_pass http://ai_backend/predict;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add CORS headers AFTER proxy for non-OPTIONS requests
            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Timeouts for image processing
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            
            # File upload limits
            client_max_body_size 10M;
            client_body_buffer_size 128k;
        }

        # Health check endpoint (lighter rate limiting)
        location /health {
            # Restricted CORS for health check
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            
            proxy_pass http://ai_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}